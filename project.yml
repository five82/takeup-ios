name: Takeup
options:
  bundleIdPrefix: xyz.five82
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: "0.41.0"

targets:
  Takeup:
    type: application
    platform: iOS
    sources:
      - Takeup
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.five82.takeup
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_UIStatusBarHidden: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
    info:
      path: Takeup/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Takeup connects to your Loom media server on the local network.
        NSBonjourServices:
          - _loom._tcp
