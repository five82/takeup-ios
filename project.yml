name: Takeup
options:
  bundleIdPrefix: xyz.five82
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Vendored MPVKit: official 0.41.0 binaries except Libmpv, which is built
# locally with a live-resize patch. See docs/mpv-live-resize.md.
packages:
  MPVKit:
    path: Vendor/MPVKit

schemes:
  Takeup:
    build:
      targets:
        Takeup: all
    run:
      config: Debug
      # MoltenVK HDR passthrough trips Metal API validation (MoltenVK#2226).
      metalAPIValidation: false

targets:
  Takeup:
    type: application
    platform: iOS
    sources:
      - Takeup
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.five82.takeup
        DEVELOPMENT_TEAM: G539654RSK
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_UIStatusBarHidden: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
    info:
      path: Takeup/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Takeup connects to your Loom media server on the local network.
        NSBonjourServices:
          - _loom._tcp
